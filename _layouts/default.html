<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    <script>
      (function () {
        var weddingPath = "https://dico1631.github.io/wedding/";
        var currentPath = window.location.pathname;
        var weddingUrl = new URL(weddingPath);
        var normalizedWeddingPath = weddingUrl.pathname.replace(/\/+$/, "") || "/";
        var normalizedCurrentPath = currentPath.replace(/\/+$/, "") || "/";

        if (normalizedCurrentPath !== normalizedWeddingPath) {
          window.location.replace(weddingPath);
        }
      })();
    </script>

    {%- include views/header.html -%}

    {%- include views/banner.html -%}

    {%- include extensions/hashlocate.html -%}

    {%- include extensions/theme-toggle.html -%}

    {%- include extensions/click-to-top.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include views/footer.html -%}

  </body>
</html>
